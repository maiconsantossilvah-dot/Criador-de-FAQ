<section class="lp-stories" aria-label="Stories do produto">
  <input class="lp-stories__radio" type="radio" name="story-demo" id="lp-story-produto-1" checked>
  <input class="lp-stories__radio" type="radio" name="story-demo" id="lp-story-produto-2">
  <div class="lp-stories__nav" aria-label="Selecionar story">
    <label class="lp-stories__option" for="lp-story-produto-1">
      <span class="lp-stories__thumb"><img src="https://placehold.co/180x180/webp" alt="Miniatura do story"></span>
      <span class="lp-stories__label">Produto</span>
    </label>
  </div>
  <div class="lp-stories__viewer">
    <article class="lp-stories__panel">
      <picture>
        <img class="lp-stories__media" src="https://placehold.co/430x670/webp" alt="Imagem do story">
      </picture>
      <div class="lp-stories__caption">Legenda do story.</div>
    </article>
  </div>
</section>
