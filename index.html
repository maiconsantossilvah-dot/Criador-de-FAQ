  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #64748b;
      --line: #d9e2ec;
      --blue: #009dff;
      --blue-dark: #0878c2;
      --green: #0f766e;
      --red: #c2410c;
      --body-glow: #eaf6ff;
      --body-glow-end: rgba(234, 246, 255, 0);
      --brand-ink: #102033;
      --panel-border: rgba(217, 226, 236, 0.9);
      --soft-button-text: #0f3554;
      --soft-button-bg: #dff2ff;
      --field-label: #314155;
      --field-border: #cbd5e1;
      --field-bg: #ffffff;
      --field-text: #0f172a;
      --editor-item-bg: #fbfdff;
      --editor-bar-bg: #eef6fc;
      --editor-bar-text: #18324a;
      --output-bg: #f8fbff;
      --output-text: #17324d;
      --preview-border: #b7c8d9;
      --preview-bg: #f8fafc;
      --shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
    }

    html[data-page="conteudo"] {
      --bg: #f3eef8;
      --body-glow: #f3eef8;
      --body-glow-end: rgba(243, 238, 248, 0);
      --brand-ink: #3a3148;
      --blue: #7c3aed;
      --blue-dark: #6d28d9;
      --green: #f97316;
      --soft-button-text: #3f3456;
      --soft-button-bg: #ebe5f2;
      --editor-bar-bg: #eee8f5;
      --editor-bar-text: #3a3148;
      --preview-border: #c9bfd8;
      --shadow: 0 16px 40px rgba(58, 49, 72, 0.1);
    }

    html[data-theme="dark"] {
      --bg: #172a34;
      --panel: #101827;
      --ink: #e5edf7;
      --muted: #9aa8bb;
      --line: #273548;
      --blue: #00a8e8;
      --blue-dark: #38c6ff;
      --green: #16a394;
      --red: #fb923c;
      --brand-ink: #f8fafc;
      --panel-border: rgba(39, 53, 72, 0.95);
      --field-label: #d8e6f3;
      --field-border: #33465e;
      --field-bg: #0b1422;
      --field-text: #e5edf7;
      --editor-item-bg: #0d1727;
      --editor-bar-bg: #122138;
      --editor-bar-text: #d8e6f3;
      --output-bg: #0b1422;
      --output-text: #e5edf7;
      --preview-border: #36556f;
      --preview-bg: #0b1422;
      --shadow: 0 20px 46px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }

    html[data-theme="dark"][data-page="conteudo"] {
      --bg: #282634;
      --panel: #171520;
      --line: #373243;
      --blue: #8b5cf6;
      --blue-dark: #a78bfa;
      --green: #fb923c;
      --panel-border: rgba(68, 61, 82, 0.95);
      --field-border: #454052;
      --field-bg: #11101a;
      --editor-item-bg: #15131e;
      --editor-bar-bg: #211d2c;
      --preview-border: #61576f;
      --preview-bg: #11101a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
      color: var(--ink);
      background:
        linear-gradient(180deg, var(--body-glow) 0, var(--body-glow-end) 320px),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html[data-page="conteudo"] body {
      background: var(--bg);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
    }

    .app {
      width: min(1320px, calc(100% - 32px));
      height: 100vh;
      margin: 0 auto;
      padding: 28px 0 20px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 0 0 auto;
      gap: 16px;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand h1 {
      margin: 0;
      color: var(--brand-ink);
      font-size: 28px;
      line-height: 1.12;
      font-weight: 800;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .page-nav {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.52);
    }

    .page-nav__link {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 8px 12px;
      border-radius: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    .page-nav__link:hover,
    .page-nav__link[aria-current="page"] {
      color: #ffffff;
      background: var(--blue);
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 10px 14px;
      border-radius: 8px;
      color: #ffffff;
      background: var(--blue);
      font-weight: 750;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
      white-space: nowrap;
    }

    .button:hover {
      background: var(--blue-dark);
      box-shadow: 0 10px 22px rgba(0, 157, 255, 0.2);
      transform: translateY(-1px);
    }

    .button:focus-visible {
      outline: 3px solid rgba(0, 157, 255, 0.25);
      outline-offset: 2px;
    }

    .button--soft {
      color: var(--soft-button-text);
      background: var(--soft-button-bg);
    }

    .button--soft:hover {
      color: #ffffff;
      background: var(--blue-dark);
    }

    .button--green {
      background: var(--green);
    }

    .button--green:hover {
      background: #0b5f59;
      box-shadow: 0 10px 22px rgba(15, 118, 110, 0.18);
    }

    .button--danger {
      color: #ffffff;
      background: #dc2626;
      box-shadow: none;
    }

    .button--danger:hover {
      color: #ffffff;
      background: #b91c1c;
      box-shadow: none;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.55);
      cursor: pointer;
      user-select: none;
    }

    .theme-toggle input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .theme-toggle__track {
      width: 42px;
      height: 24px;
      padding: 3px;
      border-radius: 999px;
      background: #cfe2f3;
      transition: background 0.16s ease;
    }

    .theme-toggle__thumb {
      display: block;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.25);
      transition: transform 0.16s ease;
    }

    .theme-toggle input:checked + .theme-toggle__track {
      background: var(--blue);
    }

    .theme-toggle input:checked + .theme-toggle__track .theme-toggle__thumb {
      transform: translateX(18px);
    }

    .theme-toggle__text {
      font-size: 13px;
      font-weight: 750;
      white-space: nowrap;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(350px, 0.78fr) minmax(520px, 1.22fr);
      gap: 18px;
      align-items: stretch;
      flex: 1;
      min-height: 0;
    }

    .panel {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .panel__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 0 0 auto;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .panel__head h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.3;
    }

    .panel__body {
      min-height: 0;
      padding: 18px;
    }

    .editor-panel .panel__body {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
    }

    .editor-tools {
      flex: 0 0 auto;
      padding: 18px 18px 0;
    }

    .editor-tools.is-hidden,
    .button.is-hidden {
      display: none;
    }

    .editor-tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      padding: 4px;
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.58);
    }

    .editor-tabs__button {
      min-height: 36px;
      padding: 8px 12px;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .editor-tabs__button:hover,
    .editor-tabs__button[aria-selected="true"] {
      color: #ffffff;
      background: var(--blue);
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 14px;
    }

    .field span {
      color: var(--field-label);
      font-size: 13px;
      font-weight: 750;
    }

    .field input,
    .field textarea {
      width: 100%;
      border: 1px solid var(--field-border);
      border-radius: 8px;
      color: var(--field-text);
      background: var(--field-bg);
      padding: 11px 12px;
      outline: none;
      transition: border 0.12s ease, box-shadow 0.12s ease;
    }

    .field input[type="color"] {
      min-height: 40px;
      padding: 5px;
      cursor: pointer;
    }

    .field textarea {
      min-height: 96px;
      resize: vertical;
      line-height: 1.5;
    }

    .field textarea.bulk-input {
      min-height: 150px;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(0, 157, 255, 0.15);
    }

    .faq-editor {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 12px;
      height: 100%;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: scroll;
      overscroll-behavior: contain;
      padding: 18px 12px 18px 18px;
      scrollbar-gutter: stable;
    }

    .editor-section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 2px 0 0;
      padding: 2px 2px 0;
    }

    .table-editor__title {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 10px;
    }

    .editor-section-title h3 {
      margin: 0;
      color: var(--brand-ink);
      font-size: 14px;
      line-height: 1.3;
    }

    .editor-section-title p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .bulk-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: -4px 0 16px;
    }

    .bulk-status {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .faq-editor__item {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--editor-item-bg);
      overflow: hidden;
    }

    .faq-editor__bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      background: var(--editor-bar-bg);
      border-bottom: 1px solid var(--line);
    }

    .faq-editor__bar strong {
      min-width: 0;
      color: var(--editor-bar-text);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .faq-editor__fields {
      padding: 12px;
    }

    .faq-bulk-panel {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--editor-item-bg);
      overflow: hidden;
    }

    .faq-bulk-panel__body {
      padding: 12px;
    }

    .faq-bulk-panel .field {
      margin-bottom: 10px;
    }

    .faq-bulk-panel .bulk-input {
      min-height: 150px;
    }

    .table-editor {
      display: grid;
      gap: 12px;
      margin-top: 8px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .table-editor__box {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--editor-item-bg);
      overflow: hidden;
    }

    .table-editor__box--sheet {
      background: transparent;
    }

    .table-editor__box-body {
      padding: 12px;
    }

    .table-editor__columns,
    .table-row-editor__cells {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .table-settings {
      display: grid;
      gap: 12px;
    }

    .table-settings__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      background: var(--editor-bar-bg);
      border-bottom: 1px solid var(--line);
    }

    .table-settings__head strong {
      color: var(--editor-bar-text);
      font-size: 13px;
    }

    .table-settings__controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .table-settings__body {
      display: grid;
      gap: 12px;
      padding: 12px;
    }

    .sheet-field {
      margin-bottom: 10px;
    }

    .sheet-field span {
      color: var(--muted);
      font-size: 12px;
      opacity: 0.72;
    }

    .field textarea.sheet-paste {
      min-height: 116px;
      padding: 8px 10px;
      color: var(--field-text);
      background:
        linear-gradient(rgba(148, 163, 184, 0.22) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.18) 1px, transparent 1px),
        var(--field-bg);
      background-size: 100% 24px, 18ch 100%, auto;
      font: 12px/1.5 Consolas, "Courier New", monospace;
      tab-size: 16;
    }

    .field textarea.sheet-paste::placeholder {
      color: var(--field-text);
      opacity: 0.38;
    }

    .table-header-color {
      width: 32px;
      height: 32px;
      min-height: 32px;
      padding: 3px;
      border: 1px solid var(--field-border);
      border-radius: 8px;
      background: var(--field-bg);
      cursor: pointer;
    }

    .table-header-color::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .table-header-color::-webkit-color-swatch {
      border: 0;
      border-radius: 5px;
    }

    .table-editor__column {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 8px;
      align-items: end;
    }

    .table-editor__column .field {
      margin-bottom: 0;
    }

    .table-row-editor__cells .field {
      margin-bottom: 0;
    }

    .table-row-editor {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--editor-item-bg);
      overflow: hidden;
    }

    .table-row-editor__cells {
      padding: 12px;
    }

    .icon-button {
      width: 32px;
      height: 32px;
      min-height: 32px;
      padding: 0;
      border-radius: 8px;
    }

    .icon-button svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
    }

    .status {
      min-height: 20px;
      color: var(--green);
      font-size: 13px;
      font-weight: 750;
      text-align: right;
    }

    .output {
      display: grid;
      flex: 1;
      grid-template-rows: auto 170px minmax(0, 1fr);
      gap: 12px;
      min-height: 0;
      overflow: hidden;
    }

    .output textarea {
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 14px;
      border: 1px solid var(--field-border);
      border-radius: 8px;
      resize: none;
      color: var(--output-text);
      background: var(--output-bg);
      font: 13px/1.45 Consolas, "Courier New", monospace;
      white-space: pre;
    }

    .preview-shell {
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 14px;
      border: 1px dashed var(--preview-border);
      border-radius: 8px;
      background: var(--preview-bg);
      overflow: hidden;
    }

    .preview-shell__label {
      display: block;
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }

    .preview-frame {
      flex: 1;
      width: 100%;
      min-height: 0;
      padding: 16px 0;
      border: 0;
      background: #ffffff;
      border-radius: 8px;
      overflow: auto;
    }

    html[data-theme="dark"] body {
      background: var(--bg);
    }

    html[data-theme="dark"] .brand h1,
    html[data-theme="dark"] .panel__head h2 {
      color: #f8fafc;
    }

    html[data-theme="dark"] .theme-toggle,
    html[data-theme="dark"] .button--soft {
      color: #d8edff;
      background: rgba(0, 168, 232, 0.13);
    }

    html[data-theme="dark"] .page-nav {
      background: transparent;
    }

    html[data-theme="dark"] .theme-toggle:hover,
    html[data-theme="dark"] .button--soft:hover {
      color: #ffffff;
      background: rgba(0, 168, 232, 0.28);
    }

    html[data-theme="dark"] .button--danger {
      color: #ffffff;
      background: #dc2626;
    }

    html[data-theme="dark"] .button--danger:hover {
      color: #ffffff;
      background: #b91c1c;
    }

    html[data-theme="dark"] .panel {
      border-color: rgba(39, 53, 72, 0.95);
    }

    html[data-theme="dark"] .field span,
    html[data-theme="dark"] .faq-editor__bar strong {
      color: #d8e6f3;
    }

    html[data-theme="dark"] .field input,
    html[data-theme="dark"] .field textarea,
    html[data-theme="dark"] .output textarea {
      border-color: #33465e;
      color: #e5edf7;
      background: #0b1422;
    }

    html[data-theme="dark"] .field input::placeholder,
    html[data-theme="dark"] .field textarea::placeholder {
      color: #6f8196;
    }

    html[data-theme="dark"] .faq-editor__item {
      background: #0d1727;
      border-color: #273548;
    }

    html[data-theme="dark"] .faq-editor__bar {
      background: #122138;
      border-bottom-color: #273548;
    }

    html[data-theme="dark"] .editor-tabs {
      background: rgba(0, 0, 0, 0.12);
    }

    html[data-theme="dark"] .editor-section-title h3 {
      color: #f8fafc;
    }

    html[data-theme="dark"] .table-editor__box,
    html[data-theme="dark"] .table-row-editor,
    html[data-theme="dark"] .faq-bulk-panel {
      background: #0d1727;
      border-color: #273548;
    }

    html[data-theme="dark"] .preview-shell {
      border-color: #36556f;
      background: #0b1422;
    }

    html[data-theme="dark"] .preview-frame {
      background: #ffffff;
    }

    html[data-theme="dark"][data-page="conteudo"] .theme-toggle,
    html[data-theme="dark"][data-page="conteudo"] .button--soft {
      color: #f3e8ff;
      background: rgba(167, 139, 250, 0.16);
    }

    html[data-theme="dark"][data-page="conteudo"] .theme-toggle:hover,
    html[data-theme="dark"][data-page="conteudo"] .button--soft:hover {
      color: #ffffff;
      background: rgba(167, 139, 250, 0.3);
    }

    @media (max-width: 920px) {
      body {
        height: auto;
        overflow: auto;
      }

      .app {
        height: auto;
        min-height: 100vh;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        justify-content: flex-start;
      }

      .page-nav {
        width: 100%;
      }

      .page-nav__link {
        flex: 1;
        justify-content: center;
      }

      .layout {
        grid-template-columns: 1fr;
        flex: initial;
      }

      .panel,
      .editor-panel .panel__body,
      .output {
        display: block;
        overflow: visible;
      }

      .faq-editor {
        height: auto;
        overflow: visible;
        padding: 14px;
      }

      .editor-tools {
        padding: 14px 14px 0;
      }

      .output textarea {
        height: auto;
        min-height: 260px;
        resize: vertical;
      }

      .preview-shell {
        display: block;
      }

      .preview-frame {
        min-height: 180px;
      }
    }

    @media (max-height: 760px) and (min-width: 921px) {
      .app {
        padding-top: 18px;
      }

      .topbar {
        margin-bottom: 14px;
      }

      .brand h1 {
        font-size: 24px;
      }

      .brand p {
        display: none;
      }

      .output {
        grid-template-rows: auto 130px minmax(0, 1fr);
      }
    }

    @media (max-width: 560px) {
      .app {
        width: min(100% - 20px, 1320px);
        padding: 18px 0;
      }

      .brand h1 {
        font-size: 24px;
      }

      .panel__head,
      .panel__body {
        padding: 14px;
      }

      .actions,
      .theme-toggle,
      .button {
        width: 100%;
      }

      .theme-toggle {
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1 id="appTitle">Compilador de FAQs</h1>
        <p id="appSubtitle">Preencha os campos e copie apenas o bloco pronto do FAQ.</p>
      </div>
      <nav class="page-nav" aria-label="Equipe">
        <a class="page-nav__link" href="#qualidade-tecnica" data-page-link="tecnica">Qualidade Técnica</a>
        <a class="page-nav__link" href="#qualidade-conteudo" data-page-link="conteudo">Qualidade Conteúdo</a>
      </nav>
      <div class="actions">
        <label class="theme-toggle" for="themeToggle">
          <input id="themeToggle" type="checkbox">
          <span class="theme-toggle__track" aria-hidden="true">
            <span class="theme-toggle__thumb"></span>
          </span>
          <span class="theme-toggle__text">Modo escuro</span>
        </label>
        <button class="button button--soft icon-button" id="addItemTop" type="button" aria-label="Adicionar pergunta" title="Adicionar pergunta">+</button>
      </div>
    </header>

    <section class="layout" aria-label="Gerador">
      <div class="panel editor-panel">
        <div class="panel__head">
          <h2>Conteúdo</h2>
          <button class="button button--soft icon-button" id="addItem" type="button" aria-label="Adicionar pergunta" title="Adicionar pergunta">+</button>
        </div>
        <div class="panel__body">
          <div class="editor-tools" id="editorTools">
            <div class="editor-tabs" role="tablist" aria-label="Tipo de conteúdo">
              <button class="editor-tabs__button" type="button" role="tab" data-editor-tab="faq">FAQ</button>
              <button class="editor-tabs__button" type="button" role="tab" data-editor-tab="table">Tabela</button>
            </div>
          </div>
          <div class="faq-editor" id="faqEditor"></div>
        </div>
      </div>

      <div class="panel output-panel">
        <div class="panel__head">
          <h2 id="outputTitle">HTML pronto</h2>
          <div class="actions">
            <button class="button button--green" id="copyHtml" type="button" data-copy-mode="html">Copiar HTML</button>
            <button class="button button--green" id="copyHtmlCss" type="button" data-copy-mode="full">Copiar HTML/CSS</button>
          </div>
        </div>
        <div class="panel__body output">
          <div class="status" id="copyStatus" aria-live="polite"></div>
          <textarea id="generatedHtml" readonly spellcheck="false" aria-label="HTML gerado"></textarea>
          <div class="preview-shell">
            <span class="preview-shell__label">Prévia</span>
            <iframe class="preview-frame" id="previewFrame" title="Prévia do FAQ"></iframe>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const faqStyle = `<style>
    * {
        padding: 0;
        margin: 0;
    }

    #faq-section {
        width: 100%;
        padding: 0rem 16px;
        box-sizing: border-box;
        margin: -10px auto 25px;
        font-family: sans-serif;
    }

    #faq-section__header {
        color: #f1f1f1;
        margin: 0 0 12px;
        font-size: 14px;
        line-height: 24px;
        letter-spacing: 0.15px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Helvetica, "Noto Sans", "Liberation Sans", Arial, sans-serif;
        font-weight: 400;
        text-decoration: none;
    }

    #faq-section__title {
        text-align: center;
        align-items: flex-start;
        background: rgb(0, 157, 255);
        border-radius: 4px;
        color: rgb(255, 255, 255);
        display: flex;
        flex-direction: row;
        height: 40px;
        margin: 0 0 8px;
        padding: 8px;
        width: 100%;
        box-sizing: border-box;
    }

    #faq-section__list {
        list-style: none;
        margin: 0 auto;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    #faq-section__item {
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 12px;
        overflow: hidden;
    }

    #faq-section__item summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 20px;
        cursor: pointer;
        list-style: none;
        transition: background 0.15s ease;
    }

    #faq-section__item summary::-webkit-details-marker {
        display: none;
    }

    #faq-section__item summary:hover {
        background: #f9f9f9;
    }

    #faq-section__item summary:focus-visible {
        outline: 2px solid #ea5b0c;
        outline-offset: -2px;
        border-radius: 12px;
    }

    #faq-section__q-text {
        font-size: 14px;
        font-weight: bold;
        color: #333;
        flex: 1;
        margin: 0;
        transition: color 0.15s ease;
    }

    #faq-section__icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        position: relative;
    }

    #faq-section__icon::before,
    #faq-section__icon::after {
        content: '';
        position: absolute;
        background: rgb(46, 53, 56);
        border-radius: 2px;
        transition: transform 0.25s ease, opacity 0.25s ease;
    }

    #faq-section__icon::before {
        width: 12px;
        height: 1.5px;
        top: 9px;
        left: 4px;
    }

    #faq-section__icon::after {
        width: 1.5px;
        height: 12px;
        top: 4px;
        left: 9px;
    }

    #faq-section__item details[open] #faq-section__icon::after {
        transform: rotate(90deg);
        opacity: 0;
    }

    #faq-section__a-inner {
        padding: 14px 20px 16px;
        border-top: 1px solid #e5e5e5;
    }

    #faq-section__a-text {
        font-size: 12px;
        color: rgb(46, 53, 56);
        line-height: 1.6;
        margin: 0;
    }

    @media (max-width: 480px) {
        #faq-section__q-text {
            font-size: 0.9rem;
        }
    }
</style>`;

    const tableStyle = `<style>
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .table-container-custom {
    background-color: #fff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    max-width: 800px;
    width: 100%;
    margin: 0 auto 25px;
    display: block;
  }

  .table-design-custom {
    width: 100%;
    border-collapse: collapse;
    margin: 0 auto;
  }

  .table-head-custom {
    color: rgb(255, 255, 255);
    border-radius: 10px;
  }

  .table-text-custom {
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid #979797;
    font-family: sans-serif;
  }

  .table-tr-custom:hover {
    background-color: #f1f1f1;
    filter: brightness(0.9);
  }

  .table-design-custom td a {
    color: #000;
    font-weight: 600;
    text-decoration: none;
  }

  .table-design-custom td a:hover {
     color: #e74011;
  }

  .table-th-custom {
    font-weight: bold;
  }

  .table-td-custom {
    color: #555;
  }

  .table-tr-custom:nth-child(even) {
    background-color: #f1f1f1;
  }
</style>`;

    const state = {
      faqBulkInput: "",
      faqBulkStatus: "",
      items: [
        { question: "", answer: "" },
        { question: "", answer: "" },
        { question: "", answer: "" }
      ],
      table: {
        caption: "",
        headerColor: "#ea5b0c",
        headerColors: ["#ea5b0c", "#ea5b0c"],
        bulkInput: "",
        status: "",
        columns: ["SKU", "TÍTULO"],
        rows: [
          ["", ""],
          ["", ""],
          ["", ""]
        ]
      }
    };

    const editor = document.querySelector("#faqEditor");
    const editorTools = document.querySelector("#editorTools");
    const generatedHtml = document.querySelector("#generatedHtml");
    const previewFrame = document.querySelector("#previewFrame");
    const copyStatus = document.querySelector("#copyStatus");
    const themeToggle = document.querySelector("#themeToggle");
    const appTitle = document.querySelector("#appTitle");
    const appSubtitle = document.querySelector("#appSubtitle");
    const outputTitle = document.querySelector("#outputTitle");
    const pageLinks = Array.from(document.querySelectorAll("[data-page-link]"));
    const editorTabButtons = Array.from(document.querySelectorAll("[data-editor-tab]"));
    const addButtons = [document.querySelector("#addItem"), document.querySelector("#addItemTop")];
    const htmlCopyButtons = [document.querySelector("#copyHtml")].filter(Boolean);
    const fullCopyButtons = [document.querySelector("#copyHtmlCss")].filter(Boolean);
    let currentPage = "conteudo";
    let currentEditorTab = "faq";

    const pageConfigs = {
      conteudo: {
        title: "Qualidade Conteúdo",
        subtitle: "Preencha o FAQ ou a tabela, depois copie o HTML no formato que precisar.",
        outputTitle: "HTML pronto",
        copyLabel: "Copiar HTML",
        fullCopyLabel: "Copiar HTML/CSS",
        copiedStatus: "HTML copiado.",
        fullCopiedStatus: "HTML/CSS copiado."
      },
      tecnica: {
        title: "Qualidade Técnica",
        subtitle: "Preencha o FAQ e copie o bloco completo com HTML e CSS.",
        outputTitle: "HTML/CSS pronto",
        copyLabel: "Copiar HTML/CSS",
        fullCopyLabel: "",
        copiedStatus: "HTML/CSS copiado.",
        fullCopiedStatus: ""
      }
    };

    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      themeToggle.checked = theme === "dark";

      try {
        localStorage.setItem("faqCompilerTheme", theme);
      } catch (error) {
        return;
      }
    }

    function getInitialTheme() {
      try {
        const savedTheme = localStorage.getItem("faqCompilerTheme");
        if (savedTheme === "dark" || savedTheme === "light") {
          return savedTheme;
        }
      } catch (error) {
        return "light";
      }

      return "light";
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatAnswer(value) {
      return escapeHtml(value.trim()).replace(/\r?\n/g, "<br>");
    }

    function normalizeHexColor(value) {
      const rawValue = String(value || "").trim();
      const colorValue = rawValue.startsWith("#") ? rawValue : `#${rawValue}`;
      const shortHexMatch = colorValue.match(/^#([0-9a-fA-F]{3})$/);

      if (shortHexMatch) {
        return `#${shortHexMatch[1].split("").map((char) => char + char).join("")}`.toLowerCase();
      }

      if (/^#[0-9a-fA-F]{6}$/.test(colorValue)) {
        return colorValue.toLowerCase();
      }

      return "#ea5b0c";
    }

    function getTableHeaderColor(index = 0) {
      return normalizeHexColor(state.table.headerColors[index] || state.table.headerColor);
    }

    function normalizeTableHeaderColors() {
      const columns = getTableColumns();
      state.table.headerColors = columns.map((column, index) => {
        return normalizeHexColor(state.table.headerColors[index] || state.table.headerColor);
      });
    }

    function getPageFromHash() {
      return window.location.hash === "#qualidade-tecnica" ? "tecnica" : "conteudo";
    }

    function updateEditorTabs() {
      const showTabs = currentPage === "conteudo";
      editorTools.classList.toggle("is-hidden", !showTabs);

      editorTabButtons.forEach((button) => {
        const isSelected = button.dataset.editorTab === currentEditorTab;
        button.setAttribute("aria-selected", String(isSelected));
        button.setAttribute("tabindex", isSelected ? "0" : "-1");
      });
    }

    function updateAddButtons() {
      const isTableTab = currentPage === "conteudo" && currentEditorTab === "table";
      const label = isTableTab ? "Adicionar linha" : "Adicionar pergunta";
      addButtons.forEach((button) => {
        button.textContent = "+";
        button.setAttribute("aria-label", label);
        button.setAttribute("title", label);
      });
    }

    function updateCopyButtons(config) {
      htmlCopyButtons.forEach((button) => {
        button.textContent = config.copyLabel;
        button.classList.remove("is-hidden");
      });

      fullCopyButtons.forEach((button) => {
        button.textContent = config.fullCopyLabel;
        button.classList.toggle("is-hidden", currentPage !== "conteudo");
      });
    }

    function applyPage(page) {
      currentPage = pageConfigs[page] ? page : "conteudo";
      if (currentPage !== "conteudo") {
        currentEditorTab = "faq";
      }

      const config = pageConfigs[currentPage];
      document.documentElement.dataset.page = currentPage;
      appTitle.textContent = config.title;
      appSubtitle.textContent = config.subtitle;
      outputTitle.textContent = config.outputTitle;
      updateCopyButtons(config);
      pageLinks.forEach((link) => {
        const isCurrent = link.dataset.pageLink === currentPage;
        if (isCurrent) {
          link.setAttribute("aria-current", "page");
        } else {
          link.removeAttribute("aria-current");
        }
      });
      updateEditorTabs();
      updateAddButtons();
      renderEditor();
    }

    function renderFaqItem(item) {
      const question = escapeHtml(item.question.trim());
      const answer = formatAnswer(item.answer);

      return `        <!-- Cole aqui as perguntas e respostas -->
        <li id="faq-section__item">
<details>
<summary>
<h3 id="faq-section__q-text"> ${question} </h3>
<span id="faq-section__icon" aria-hidden="true"></span>
</summary>
<div id="faq-section__a-inner">
<p id="faq-section__a-text"> ${answer} </p>
</div>
</details>
</li>
        <!-------------------------->`;
    }

    function buildFaqSectionHtml() {
      const items = state.items
        .filter((item) => item.question.trim() || item.answer.trim())
        .map(renderFaqItem)
        .join("\n\n");

      return `<section id="faq-section" aria-labelledby="faq-section-title">
<div id="faq-section__header">
<h2 id="faq-section__title" id="faq-section-title">Dúvidas Frequentes</h2>
</div>
<ul id="faq-section__list" role="list">
${items}
</ul>
</section>`;
    }

    function getTableColumns() {
      return state.table.columns.length ? state.table.columns : ["SKU", "TÍTULO"];
    }

    function getVisibleTableRows() {
      return state.table.rows.filter((row) => row.some((cell) => cell.trim()));
    }

    function hasTableData() {
      return getVisibleTableRows().length > 0;
    }

    function getHeaderRadius(index, total) {
      if (total === 1) {
        return "10px 10px 0 0";
      }

      if (index === 0) {
        return "10px 0 0 0";
      }

      if (index === total - 1) {
        return "0 10px 0 0";
      }

      return "";
    }

    function renderTableHeaderCell(label, index, total) {
      const radius = getHeaderRadius(index, total);
      const radiusStyle = radius ? ` border-radius: ${radius};` : "";
      const headerText = escapeHtml(label.trim() || `COLUNA ${index + 1}`);

      return `                 <th class="table-text-custom table-th-custom" style="background-color: ${getTableHeaderColor(index)};${radiusStyle}" scope="col">${headerText}
                 </th>`;
    }

    function renderTableRow(row) {
      const columns = getTableColumns();
      const cells = columns.map((column, index) => {
        const cellClass = index === 0 ? "table-td-custom-title" : "table-td-custom-sub";
        return `                 <td class="table-text-custom ${cellClass}">${escapeHtml((row[index] || "").trim())}</td>`;
      }).join("\n");

      return `               <tr class="table-tr-custom">
${cells}
               </tr>`;
    }

    function buildTableSectionHtml(forcePreview = false) {
      if (!forcePreview && !hasTableData()) {
        return "";
      }

      const columns = getTableColumns();
      const caption = escapeHtml(state.table.caption.trim() || "produtos relacionados");
      const headers = columns.map(renderTableHeaderCell).join("\n");
      const visibleRows = getVisibleTableRows();
      const previewRows = visibleRows.length ? visibleRows : [createEmptyTableRow()];
      const rows = (forcePreview ? previewRows : visibleRows).map(renderTableRow).join("\n");

      return `<section class="table-container-custom" aria-label="tabela contendo produtos relacionados e citados dentre deste conteúdo">
          <table class="table-design-custom" aria-describedby="table-desc">
            <caption id="table-desc" class="sr-only" style="text-align:left; padding: 0 0 8px; font-weight:600;">
          ${caption}
          </caption>
            <thead class="table-head-custom">
               <tr class="table-tr-custom">
${headers}
               </tr>
             </thead>
             <tbody>
${rows}
             </tbody>
           </table>
         </section>`;
    }

    function buildBlocksHtml(includeTable) {
      const blocks = [buildFaqSectionHtml()];
      const tableHtml = includeTable ? buildTableSectionHtml() : "";

      if (tableHtml) {
        blocks.push(tableHtml);
      }

      return blocks.join("\n\n");
    }

    function buildFullHtml(includeTable) {
      const styles = includeTable && hasTableData() ? `${faqStyle}\n\n${tableStyle}` : faqStyle;

      return `<meta charset="UTF-8">
${buildBlocksHtml(includeTable)}

<!-- ESSES CÓDIGOS ABAIXO VOCÊ NÃO PRECISA MEXER!!! APENAS O HTML ACIMA-->

${styles}`;
    }

    function buildPreviewHtml() {
      if (currentPage === "conteudo" && currentEditorTab === "table") {
        return `<meta charset="UTF-8">
${buildTableSectionHtml(true)}

${tableStyle}`;
      }

      if (currentPage === "conteudo") {
        return `<meta charset="UTF-8">
${buildFaqSectionHtml()}

${faqStyle}`;
      }

      return buildFullHtml(false);
    }

    function buildOutputHtml(copyMode = "html") {
      if (currentPage === "tecnica") {
        return buildFullHtml(false);
      }

      if (currentEditorTab === "table") {
        const tableHtml = buildTableSectionHtml(true);

        if (copyMode === "full") {
          return `<meta charset="UTF-8">
${tableHtml}

<!-- ESSES CÓDIGOS ABAIXO VOCÊ NÃO PRECISA MEXER!!! APENAS O HTML ACIMA-->

${tableStyle}`;
        }

        return tableHtml;
      }

      const faqHtml = buildFaqSectionHtml();

      if (copyMode === "full") {
        return `<meta charset="UTF-8">
${faqHtml}

<!-- ESSES CÓDIGOS ABAIXO VOCÊ NÃO PRECISA MEXER!!! APENAS O HTML ACIMA-->

${faqStyle}`;
      }

      return faqHtml;
    }

    function updateOutput() {
      generatedHtml.value = buildOutputHtml("html");
      previewFrame.srcdoc = buildPreviewHtml();
      copyStatus.textContent = "";
    }

    function renderFaqEditorItems() {
      return state.items.map((item, index) => `
        <article class="faq-editor__item" data-index="${index}">
          <div class="faq-editor__bar">
            <strong>Pergunta ${index + 1}</strong>
            <button class="button button--danger icon-button" type="button" data-action="remove" aria-label="Remover pergunta ${index + 1}" title="Remover pergunta">${trashIcon()}</button>
          </div>
          <div class="faq-editor__fields">
            <label class="field">
              <span>Pergunta</span>
              <input type="text" value="${escapeHtml(item.question)}" data-field="question" autocomplete="off">
            </label>
            <label class="field">
              <span>Resposta</span>
              <textarea data-field="answer">${escapeHtml(item.answer)}</textarea>
            </label>
          </div>
        </article>
      `).join("");
    }

    function renderFaqEditor() {
      return `
        <div class="editor-section-title">
          <div>
            <h3>FAQ</h3>
            <p>Perguntas e respostas do bloco de dúvidas frequentes.</p>
          </div>
        </div>

        <article class="faq-bulk-panel">
          <div class="faq-editor__bar">
            <strong>Colar texto completo do FAQ</strong>
          </div>
          <div class="faq-bulk-panel__body">
            <label class="field">
              <span>Perguntas e respostas em massa</span>
              <textarea class="bulk-input" data-faq-bulk="input" spellcheck="false">${escapeHtml(state.faqBulkInput)}</textarea>
            </label>
            <div class="bulk-actions">
              <button class="button button--soft" type="button" data-action="fill-faq-bulk">Preencher FAQ</button>
              <span class="bulk-status" aria-live="polite">${escapeHtml(state.faqBulkStatus)}</span>
            </div>
          </div>
        </article>

        ${renderFaqEditorItems()}
      `;
    }

    function trashIcon() {
      return `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 7h16" stroke-width="2" stroke-linecap="round"></path>
        <path d="M10 11v6" stroke-width="2" stroke-linecap="round"></path>
        <path d="M14 11v6" stroke-width="2" stroke-linecap="round"></path>
        <path d="M6 7l1 14h10l1-14" stroke-width="2" stroke-linejoin="round"></path>
        <path d="M9 7V4h6v3" stroke-width="2" stroke-linejoin="round"></path>
      </svg>`;
    }

    function renderTableEditor() {
      if (currentPage !== "conteudo") {
        return "";
      }

      normalizeTableHeaderColors();
      const columns = getTableColumns();
      const columnFields = columns.map((column, index) => `
              <div class="table-editor__column">
                <input class="table-header-color" type="color" value="${getTableHeaderColor(index)}" data-table-field="columnHeaderColor" data-column-index="${index}" aria-label="Cor do cabeçalho da coluna ${index + 1}" title="Cor do cabeçalho">
                <label class="field">
                  <span>Coluna ${index + 1}</span>
                  <input type="text" value="${escapeHtml(column)}" data-table-field="column" data-column-index="${index}" autocomplete="off">
                </label>
              </div>
            `).join("");

      const rows = state.table.rows.map((row, rowIndex) => `
        <article class="table-row-editor" data-table-row="${rowIndex}">
          <div class="faq-editor__bar">
            <strong>Linha ${rowIndex + 1}</strong>
            <button class="button button--danger icon-button" type="button" data-action="remove-table-row" aria-label="Remover linha ${rowIndex + 1}" title="Remover linha">${trashIcon()}</button>
          </div>
          <div class="table-row-editor__cells">
            ${columns.map((column, cellIndex) => `
              <label class="field">
                <span>${escapeHtml(column.trim() || `Coluna ${cellIndex + 1}`)}</span>
                <input type="text" value="${escapeHtml(row[cellIndex] || "")}" data-table-field="cell" data-row-index="${rowIndex}" data-cell-index="${cellIndex}" autocomplete="off">
              </label>
            `).join("")}
          </div>
        </article>
      `).join("");

      return `
        <section class="table-editor" aria-label="Editor da tabela">
          <div class="editor-section-title">
            <div class="table-editor__title">
              <div>
                <h3>Tabela</h3>
                <p>Cole da planilha ou edite as células abaixo.</p>
              </div>
            </div>
          </div>

          <article class="table-editor__box table-settings">
            <div class="table-settings__head">
              <strong>Configurações</strong>
              <div class="table-settings__controls">
                <button class="button button--soft icon-button" type="button" data-action="add-table-column" aria-label="Adicionar coluna" title="Adicionar coluna">+</button>
              </div>
            </div>
            <div class="table-settings__body">
              <label class="field">
                <span>Caption de Acessibilidade</span>
                <input type="text" value="${escapeHtml(state.table.caption)}" data-table-field="caption" autocomplete="off" placeholder="tamanhos de chinelos disponíveis">
              </label>
              <div class="table-editor__columns">
${columnFields}
              </div>
            </div>
          </article>

          <article class="table-editor__box table-editor__box--sheet">
            <div class="table-editor__box-body">
              <label class="field sheet-field">
                <span>Colar conteúdo de planilha ou .txt</span>
                <textarea class="bulk-input sheet-paste" data-table-field="bulk" spellcheck="false" placeholder="SKU&#9;TÍTULO&#10;1225007&#9;HAVAIANAS TOP.BASIC BRANCO/BRANCO/VERDE 37/8&#10;1225008&#9;HAVAIANAS KIDS ATHLETIC VERDE PATRIA 25/6">${escapeHtml(state.table.bulkInput)}</textarea>
              </label>
              <div class="bulk-actions">
                <button class="button button--soft" type="button" data-action="fill-table-bulk">Preencher tabela</button>
                <span class="bulk-status" aria-live="polite">${escapeHtml(state.table.status)}</span>
              </div>
            </div>
          </article>

${rows}
        </section>
      `;
    }

    function renderEditor() {
      updateEditorTabs();
      updateAddButtons();
      editor.innerHTML = currentPage === "conteudo" && currentEditorTab === "table"
        ? renderTableEditor()
        : renderFaqEditor();
      editor.scrollTop = 0;

      updateOutput();
    }

    function parseBulkFaq(value) {
      const normalized = value.replace(/\r\n?/g, "\n");
      const questionPattern = /(?:^|\n)\s*(?:\d+|[A-Za-z])\.\s*([\s\S]*?\?)/g;
      const matches = [];
      const items = [];
      let match;

      while ((match = questionPattern.exec(normalized)) !== null) {
        matches.push({
          start: match.index,
          end: match.index + match[0].length,
          question: match[1].replace(/\s+/g, " ").trim()
        });
      }

      matches.forEach((item, index) => {
        const nextItem = matches[index + 1];
        const answerEnd = nextItem ? nextItem.start : normalized.length;
        const answer = normalized.slice(item.end, answerEnd).trim();

        if (item.question || answer) {
          items.push({ question: item.question, answer });
        }
      });

      return items;
    }

    function fillFromBulk() {
      const parsedItems = parseBulkFaq(state.faqBulkInput);

      if (!parsedItems.length) {
        state.faqBulkStatus = "Não encontrei perguntas no formato 1. Pergunta?";
        renderEditor();
        return;
      }

      state.items = parsedItems;
      state.faqBulkStatus = `${parsedItems.length} pergunta${parsedItems.length === 1 ? "" : "s"} preenchida${parsedItems.length === 1 ? "" : "s"}.`;
      renderEditor();
    }

    function createEmptyTableRow() {
      return getTableColumns().map(() => "");
    }

    function normalizeTableRows() {
      const columns = getTableColumns();
      state.table.rows = state.table.rows.map((row) => columns.map((column, index) => row[index] || ""));

      if (!state.table.rows.length) {
        state.table.rows.push(createEmptyTableRow());
      }
    }

    function parseBulkTableHtml(value) {
      const html = value.includes("<table") ? value : `<table>${value}</table>`;
      const documentValue = new DOMParser().parseFromString(html, "text/html");
      const headerCells = Array.from(documentValue.querySelectorAll("thead th"));
      const columns = headerCells.map((cell) => cell.textContent.replace(/\s+/g, " ").trim()).filter(Boolean);
      let rowElements = Array.from(documentValue.querySelectorAll("tbody tr"));

      if (!rowElements.length) {
        rowElements = Array.from(documentValue.querySelectorAll("tr")).filter((row) => row.querySelector("td"));
      }

      const rows = rowElements
        .map((row) => Array.from(row.querySelectorAll("td")).map((cell) => cell.textContent.replace(/\s+/g, " ").trim()))
        .filter((row) => row.some(Boolean));

      return { columns, rows };
    }

    function parseBulkTableText(value) {
      const lines = value
        .replace(/\r\n?/g, "\n")
        .split("\n")
        .map((line) => line.trim())
        .filter(Boolean);

      const rows = lines.map((line) => {
        if (line.includes("\t")) {
          return line.split("\t").map((cell) => cell.trim());
        }

        if (line.includes(";")) {
          return line.split(";").map((cell) => cell.trim());
        }

        const skuAndTitle = line.match(/^(\S+)\s+(.+)$/);
        return skuAndTitle ? [skuAndTitle[1], skuAndTitle[2]] : [line];
      }).filter((row) => row.some(Boolean));

      const firstRow = rows[0] || [];
      const firstRowLooksLikeHeader = rows.length > 1 && firstRow.some((cell) => /sku|t[ií]tulo|produto|descri[cç][aã]o/i.test(cell));

      return {
        columns: firstRowLooksLikeHeader ? firstRow : [],
        rows: firstRowLooksLikeHeader ? rows.slice(1) : rows
      };
    }

    function parseBulkTable(value) {
      const trimmed = value.trim();

      if (!trimmed) {
        return { columns: [], rows: [] };
      }

      if (/<\/?(table|thead|tbody|tr|td|th)\b/i.test(trimmed)) {
        return parseBulkTableHtml(trimmed);
      }

      return parseBulkTableText(trimmed);
    }

    function fillTableFromBulk() {
      const parsedTable = parseBulkTable(state.table.bulkInput);

      if (!parsedTable.rows.length) {
        state.table.status = "Não encontrei linhas para preencher.";
        renderEditor();
        return;
      }

      const maxColumns = Math.max(
        parsedTable.columns.length,
        state.table.columns.length,
        ...parsedTable.rows.map((row) => row.length)
      );

      state.table.columns = Array.from({ length: maxColumns }, (item, index) => {
        return parsedTable.columns[index] || state.table.columns[index] || `COLUNA ${index + 1}`;
      });
      state.table.headerColors = Array.from({ length: maxColumns }, (item, index) => {
        return normalizeHexColor(state.table.headerColors[index] || state.table.headerColor);
      });

      state.table.rows = parsedTable.rows.map((row) => {
        return Array.from({ length: maxColumns }, (item, index) => row[index] || "");
      });

      state.table.status = `${state.table.rows.length} linha${state.table.rows.length === 1 ? "" : "s"} preenchida${state.table.rows.length === 1 ? "" : "s"}.`;
      renderEditor();
    }

    function addTableColumn() {
      state.table.columns.push("");
      state.table.headerColors.push(normalizeHexColor(state.table.headerColor));
      state.table.rows.forEach((row) => row.push(""));
      state.table.status = "";
      renderEditor();
    }

    function removeTableColumn(index) {
      if (state.table.columns.length <= 1) {
        return;
      }

      state.table.columns.splice(index, 1);
      state.table.headerColors.splice(index, 1);
      state.table.rows.forEach((row) => row.splice(index, 1));
      state.table.status = "";
      normalizeTableRows();
      normalizeTableHeaderColors();
      renderEditor();
    }

    function addTableRow() {
      state.table.rows.push(createEmptyTableRow());
      state.table.status = "";
      renderEditor();
      const lastRowInput = editor.querySelector(`[data-table-row="${state.table.rows.length - 1}"] input`);
      if (lastRowInput) {
        lastRowInput.focus();
      }
    }

    function removeTableRow(index) {
      state.table.rows.splice(index, 1);
      state.table.status = "";
      normalizeTableRows();
      renderEditor();
    }

    function addItem() {
      state.items.push({ question: "", answer: "" });
      renderEditor();
      const lastItem = editor.querySelector(`.faq-editor__item[data-index="${state.items.length - 1}"] input`);
      if (lastItem) {
        lastItem.focus();
      }
    }

    function addCurrentItem() {
      if (currentPage === "conteudo" && currentEditorTab === "table") {
        addTableRow();
        return;
      }

      addItem();
    }

    async function copyGeneratedHtml(mode = "html") {
      const copyMode = mode === "full" ? "full" : "html";
      const value = buildOutputHtml(copyMode);
      generatedHtml.value = value;
      generatedHtml.focus();
      generatedHtml.select();

      try {
        await navigator.clipboard.writeText(value);
      } catch (error) {
        document.execCommand("copy");
      }

      copyStatus.textContent = copyMode === "full" && currentPage === "conteudo"
        ? pageConfigs[currentPage].fullCopiedStatus
        : pageConfigs[currentPage].copiedStatus;
      window.setTimeout(() => {
        copyStatus.textContent = "";
      }, 2400);
    }

    editor.addEventListener("input", (event) => {
      const faqBulkField = event.target.dataset.faqBulk;
      if (faqBulkField) {
        state.faqBulkInput = event.target.value;
        state.faqBulkStatus = "";
        return;
      }

      const tableField = event.target.dataset.tableField;
      if (tableField) {
        if (tableField === "caption") {
          state.table.caption = event.target.value;
          updateOutput();
        }

        if (tableField === "headerColor") {
          state.table.headerColor = event.target.value;
          if (event.target.type === "color") {
            renderEditor();
            return;
          }
          updateOutput();
        }

        if (tableField === "columnHeaderColor") {
          const columnIndex = Number(event.target.dataset.columnIndex);
          state.table.headerColors[columnIndex] = event.target.value;
          renderEditor();
          return;
        }

        if (tableField === "bulk") {
          state.table.bulkInput = event.target.value;
          state.table.status = "";
        }

        if (tableField === "column") {
          const columnIndex = Number(event.target.dataset.columnIndex);
          state.table.columns[columnIndex] = event.target.value;
          updateOutput();
        }

        if (tableField === "cell") {
          const rowIndex = Number(event.target.dataset.rowIndex);
          const cellIndex = Number(event.target.dataset.cellIndex);
          state.table.rows[rowIndex][cellIndex] = event.target.value;
          updateOutput();
        }

        return;
      }

      const field = event.target.dataset.field;
      if (!field) {
        return;
      }

      const itemElement = event.target.closest(".faq-editor__item");
      const index = Number(itemElement.dataset.index);
      state.items[index][field] = event.target.value;
      updateOutput();
    });

    editor.addEventListener("click", (event) => {
      const button = event.target.closest("[data-action]");
      if (!button) {
        return;
      }

      const action = button.dataset.action;

      if (action === "remove") {
        const itemElement = button.closest(".faq-editor__item");
        const index = Number(itemElement.dataset.index);
        state.items.splice(index, 1);

        if (state.items.length === 0) {
          state.items.push({ question: "", answer: "" });
        }

        renderEditor();
        return;
      }

      if (action === "fill-faq-bulk") {
        fillFromBulk();
      }

      if (action === "add-table-column") {
        addTableColumn();
      }

      if (action === "remove-table-column") {
        removeTableColumn(Number(button.dataset.columnIndex));
      }

      if (action === "add-table-row") {
        addTableRow();
      }

      if (action === "remove-table-row") {
        const rowElement = button.closest("[data-table-row]");
        removeTableRow(Number(rowElement.dataset.tableRow));
      }

      if (action === "fill-table-bulk") {
        fillTableFromBulk();
      }
    });

    editorTabButtons.forEach((button) => {
      button.addEventListener("click", () => {
        currentEditorTab = button.dataset.editorTab === "table" ? "table" : "faq";
        renderEditor();
      });
    });

    document.querySelector("#addItem").addEventListener("click", addCurrentItem);
    document.querySelector("#addItemTop").addEventListener("click", addCurrentItem);
    [...htmlCopyButtons, ...fullCopyButtons].forEach((button) => {
      button.addEventListener("click", () => {
        copyGeneratedHtml(button.dataset.copyMode);
      });
    });
    window.addEventListener("hashchange", () => {
      applyPage(getPageFromHash());
    });
    themeToggle.addEventListener("change", () => {
      setTheme(themeToggle.checked ? "dark" : "light");
    });

    setTheme(getInitialTheme());
    applyPage(getPageFromHash());
  </script>
</body>
</html>
