<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compilador de FAQs</title>
  <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCIgcm9sZT0iaW1nIiBhcmlhLWxhYmVsPSJDcmlhZG9yIGRlIEZBUSI+CiAgPHBhdGggZD0iTTI5IDE0IDkgMzIgMjkgNTAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzAwYThlOCIgc3Ryb2tlLXdpZHRoPSI3IiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz4KICA8cGF0aCBkPSJNMzUgMTQgNTUgMzIgMzUgNTAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzAwYThlOCIgc3Ryb2tlLXdpZHRoPSI3IiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz4KICA8Y2lyY2xlIGN4PSIzMiIgY3k9IjMyIiByPSI1IiBmaWxsPSIjMGY3NjZlIi8+Cjwvc3ZnPg==" type="image/svg+xml">
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #64748b;
      --line: #d9e2ec;
      --blue: #009dff;
      --blue-dark: #0878c2;
      --green: #0f766e;
      --red: #c2410c;
      --shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
      color: var(--ink);
      background:
        linear-gradient(180deg, #eaf6ff 0, rgba(234, 246, 255, 0) 320px),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
    }

    .app {
      width: min(1320px, calc(100% - 32px));
      height: 100vh;
      margin: 0 auto;
      padding: 28px 0 20px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 0 0 auto;
      gap: 16px;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand h1 {
      margin: 0;
      color: #102033;
      font-size: 28px;
      line-height: 1.12;
      font-weight: 800;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 10px 14px;
      border-radius: 8px;
      color: #ffffff;
      background: var(--blue);
      font-weight: 750;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
      white-space: nowrap;
    }

    .button:hover {
      background: var(--blue-dark);
      box-shadow: 0 10px 22px rgba(0, 157, 255, 0.2);
      transform: translateY(-1px);
    }

    .button:focus-visible {
      outline: 3px solid rgba(0, 157, 255, 0.25);
      outline-offset: 2px;
    }

    .button--soft {
      color: #0f3554;
      background: #dff2ff;
    }

    .button--soft:hover {
      color: #ffffff;
      background: var(--blue-dark);
    }

    .button--green {
      background: var(--green);
    }

    .button--green:hover {
      background: #0b5f59;
      box-shadow: 0 10px 22px rgba(15, 118, 110, 0.18);
    }

    .button--danger {
      color: var(--red);
      background: #fff1e8;
      box-shadow: none;
    }

    .button--danger:hover {
      color: #ffffff;
      background: var(--red);
      box-shadow: none;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(350px, 0.78fr) minmax(520px, 1.22fr);
      gap: 18px;
      align-items: stretch;
      flex: 1;
      min-height: 0;
    }

    .panel {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid rgba(217, 226, 236, 0.9);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .panel__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 0 0 auto;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .panel__head h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.3;
    }

    .panel__body {
      min-height: 0;
      padding: 18px;
    }

    .editor-panel .panel__body {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
    }

    .editor-tools {
      flex: 0 0 auto;
      padding: 18px 18px 0;
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 14px;
    }

    .field span {
      color: #314155;
      font-size: 13px;
      font-weight: 750;
    }

    .field input,
    .field textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: #0f172a;
      background: #ffffff;
      padding: 11px 12px;
      outline: none;
      transition: border 0.12s ease, box-shadow 0.12s ease;
    }

    .field textarea {
      min-height: 96px;
      resize: vertical;
      line-height: 1.5;
    }

    .field textarea.bulk-input {
      min-height: 150px;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(0, 157, 255, 0.15);
    }

    .faq-editor {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 12px;
      height: 100%;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: scroll;
      overscroll-behavior: contain;
      padding: 18px 12px 18px 18px;
      scrollbar-gutter: stable;
    }

    .bulk-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: -4px 0 16px;
    }

    .bulk-status {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .faq-editor__item {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfdff;
      overflow: hidden;
    }

    .faq-editor__bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      background: #eef6fc;
      border-bottom: 1px solid var(--line);
    }

    .faq-editor__bar strong {
      min-width: 0;
      color: #18324a;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .faq-editor__fields {
      padding: 12px;
    }

    .status {
      min-height: 20px;
      color: var(--green);
      font-size: 13px;
      font-weight: 750;
      text-align: right;
    }

    .output {
      display: grid;
      flex: 1;
      grid-template-rows: auto 170px minmax(0, 1fr);
      gap: 12px;
      min-height: 0;
      overflow: hidden;
    }

    .output textarea {
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      resize: none;
      color: #17324d;
      background: #f8fbff;
      font: 13px/1.45 Consolas, "Courier New", monospace;
      white-space: pre;
    }

    .preview-shell {
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 14px;
      border: 1px dashed #b7c8d9;
      border-radius: 8px;
      background: #f8fafc;
      overflow: hidden;
    }

    .preview-shell__label {
      display: block;
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }

    .preview-frame {
      flex: 1;
      width: 100%;
      min-height: 0;
      padding: 16px 0;
      border: 0;
      background: #ffffff;
      border-radius: 8px;
      overflow: auto;
    }

    @media (max-width: 920px) {
      body {
        height: auto;
        overflow: auto;
      }

      .app {
        height: auto;
        min-height: 100vh;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        justify-content: flex-start;
      }

      .layout {
        grid-template-columns: 1fr;
        flex: initial;
      }

      .panel,
      .editor-panel .panel__body,
      .output {
        display: block;
        overflow: visible;
      }

      .faq-editor {
        height: auto;
        overflow: visible;
        padding: 14px;
      }

      .editor-tools {
        padding: 14px 14px 0;
      }

      .output textarea {
        height: auto;
        min-height: 260px;
        resize: vertical;
      }

      .preview-shell {
        display: block;
      }

      .preview-frame {
        min-height: 180px;
      }
    }

    @media (max-height: 760px) and (min-width: 921px) {
      .app {
        padding-top: 18px;
      }

      .topbar {
        margin-bottom: 14px;
      }

      .brand h1 {
        font-size: 24px;
      }

      .brand p {
        display: none;
      }

      .output {
        grid-template-rows: auto 130px minmax(0, 1fr);
      }
    }

    @media (max-width: 560px) {
      .app {
        width: min(100% - 20px, 1320px);
        padding: 18px 0;
      }

      .brand h1 {
        font-size: 24px;
      }

      .panel__head,
      .panel__body {
        padding: 14px;
      }

      .actions,
      .button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>Compilador de FAQs</h1>
        <p>Preencha os campos e copie apenas o bloco pronto do FAQ.</p>
      </div>
      <div class="actions">
        <button class="button button--soft" id="addItemTop" type="button">Adicionar pergunta</button>
        <button class="button button--green" id="copyHtmlTop" type="button">Copiar HTML</button>
      </div>
    </header>

    <section class="layout" aria-label="Gerador">
      <div class="panel editor-panel">
        <div class="panel__head">
          <h2>Conteúdo</h2>
          <button class="button button--soft" id="addItem" type="button">Adicionar</button>
        </div>
        <div class="panel__body">
          <div class="editor-tools">
            <label class="field">
              <span>Colar perguntas e respostas</span>
              <textarea class="bulk-input" id="bulkFaqInput" spellcheck="false" placeholder="4. O produto contém glúten?

Não. O adoçante não contém glúten, o que amplia as possibilidades de consumo para diferentes rotinas alimentares.

5. O sabor funciona bem no café?

Sim. A apresentação líquida facilita a diluição e ajuda no uso em bebidas quentes como café e chá."></textarea>
            </label>

            <div class="bulk-actions">
              <button class="button button--soft" id="fillFromBulk" type="button">Preencher campos</button>
              <span class="bulk-status" id="bulkStatus" aria-live="polite"></span>
            </div>
          </div>
          <div class="faq-editor" id="faqEditor"></div>
        </div>
      </div>

      <div class="panel output-panel">
        <div class="panel__head">
          <h2>HTML pronto</h2>
          <div class="actions">
            <button class="button button--green" id="copyHtml" type="button">Copiar</button>
          </div>
        </div>
        <div class="panel__body output">
          <div class="status" id="copyStatus" aria-live="polite"></div>
          <textarea id="generatedHtml" readonly spellcheck="false" aria-label="HTML gerado"></textarea>
          <div class="preview-shell">
            <span class="preview-shell__label">Prévia</span>
            <iframe class="preview-frame" id="previewFrame" title="Prévia do FAQ"></iframe>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const faqStyle = `<style>
    * {
        padding: 0;
        margin: 0;
    }

    #faq-section {
        width: 100%;
        padding: 0rem 16px;
        box-sizing: border-box;
        margin: -10px auto 25px;
        font-family: sans-serif;
    }

    #faq-section__header {
        color: #f1f1f1;
        margin: 0 0 12px;
        font-size: 14px;
        line-height: 24px;
        letter-spacing: 0.15px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Helvetica, "Noto Sans", "Liberation Sans", Arial, sans-serif;
        font-weight: 400;
        text-decoration: none;
    }

    #faq-section__title {
        text-align: center;
        align-items: flex-start;
        background: rgb(0, 157, 255);
        border-radius: 4px;
        color: rgb(255, 255, 255);
        display: flex;
        flex-direction: row;
        height: 40px;
        margin: 0 0 8px;
        padding: 8px;
        width: 100%;
        box-sizing: border-box;
    }

    #faq-section__list {
        list-style: none;
        margin: 0 auto;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    #faq-section__item {
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 12px;
        overflow: hidden;
    }

    #faq-section__item summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 20px;
        cursor: pointer;
        list-style: none;
        transition: background 0.15s ease;
    }

    #faq-section__item summary::-webkit-details-marker {
        display: none;
    }

    #faq-section__item summary:hover {
        background: #f9f9f9;
    }

    #faq-section__item summary:focus-visible {
        outline: 2px solid #ea5b0c;
        outline-offset: -2px;
        border-radius: 12px;
    }

    #faq-section__q-text {
        font-size: 14px;
        font-weight: bold;
        color: #333;
        flex: 1;
        margin: 0;
        transition: color 0.15s ease;
    }

    #faq-section__icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        position: relative;
    }

    #faq-section__icon::before,
    #faq-section__icon::after {
        content: '';
        position: absolute;
        background: rgb(46, 53, 56);
        border-radius: 2px;
        transition: transform 0.25s ease, opacity 0.25s ease;
    }

    #faq-section__icon::before {
        width: 12px;
        height: 1.5px;
        top: 9px;
        left: 4px;
    }

    #faq-section__icon::after {
        width: 1.5px;
        height: 12px;
        top: 4px;
        left: 9px;
    }

    #faq-section__item details[open] #faq-section__icon::after {
        transform: rotate(90deg);
        opacity: 0;
    }

    #faq-section__a-inner {
        padding: 14px 20px 16px;
        border-top: 1px solid #e5e5e5;
    }

    #faq-section__a-text {
        font-size: 12px;
        color: rgb(46, 53, 56);
        line-height: 1.6;
        margin: 0;
    }

    @media (max-width: 480px) {
        #faq-section__q-text {
            font-size: 0.9rem;
        }
    }
</style>`;

    const state = {
      items: [
        { question: "", answer: "" },
        { question: "", answer: "" },
        { question: "", answer: "" }
      ]
    };

    const bulkInput = document.querySelector("#bulkFaqInput");
    const bulkStatus = document.querySelector("#bulkStatus");
    const editor = document.querySelector("#faqEditor");
    const generatedHtml = document.querySelector("#generatedHtml");
    const previewFrame = document.querySelector("#previewFrame");
    const copyStatus = document.querySelector("#copyStatus");

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatAnswer(value) {
      return escapeHtml(value.trim()).replace(/\r?\n/g, "<br>");
    }

    function renderFaqItem(item) {
      const question = escapeHtml(item.question.trim());
      const answer = formatAnswer(item.answer);

      return `        <!-- Cole aqui as perguntas e respostas -->
        <li id="faq-section__item">
<details>
<summary>
<h3 id="faq-section__q-text"> ${question} </h3>
<span id="faq-section__icon" aria-hidden="true"></span>
</summary>
<div id="faq-section__a-inner">
<p id="faq-section__a-text"> ${answer} </p>
</div>
</details>
</li>
        <!-------------------------->`;
    }

    function buildFaqHtml() {
      const items = state.items
        .filter((item) => item.question.trim() || item.answer.trim())
        .map(renderFaqItem)
        .join("\n\n");

      return `<meta charset="UTF-8">
<section id="faq-section" aria-labelledby="faq-section-title">
<div id="faq-section__header">
<h2 id="faq-section__title" id="faq-section-title">Dúvidas Frequentes</h2>
</div>
<ul id="faq-section__list" role="list">
${items}
</ul>
</section>

<!-- ESSES CÓDIGOS ABAIXO VOCÊ NÃO PRECISA MEXER!!! APENAS O HTML ACIMA-->

${faqStyle}`;
    }

    function updateOutput() {
      const html = buildFaqHtml();
      generatedHtml.value = html;
      previewFrame.srcdoc = html;
      copyStatus.textContent = "";
    }

    function renderEditor() {
      editor.innerHTML = state.items.map((item, index) => `
        <article class="faq-editor__item" data-index="${index}">
          <div class="faq-editor__bar">
            <strong>Pergunta ${index + 1}</strong>
            <button class="button button--danger" type="button" data-action="remove">Remover</button>
          </div>
          <div class="faq-editor__fields">
            <label class="field">
              <span>Pergunta</span>
              <input type="text" value="${escapeHtml(item.question)}" data-field="question" autocomplete="off">
            </label>
            <label class="field">
              <span>Resposta</span>
              <textarea data-field="answer">${escapeHtml(item.answer)}</textarea>
            </label>
          </div>
        </article>
      `).join("");

      updateOutput();
    }

    function parseBulkFaq(value) {
      const normalized = value.replace(/\r\n?/g, "\n");
      const questionPattern = /(?:^|\n)\s*(?:\d+|[A-Za-z])\.\s*([\s\S]*?\?)/g;
      const matches = [];
      const items = [];
      let match;

      while ((match = questionPattern.exec(normalized)) !== null) {
        matches.push({
          start: match.index,
          end: match.index + match[0].length,
          question: match[1].replace(/\s+/g, " ").trim()
        });
      }

      matches.forEach((item, index) => {
        const nextItem = matches[index + 1];
        const answerEnd = nextItem ? nextItem.start : normalized.length;
        const answer = normalized.slice(item.end, answerEnd).trim();

        if (item.question || answer) {
          items.push({ question: item.question, answer });
        }
      });

      return items;
    }

    function fillFromBulk() {
      const parsedItems = parseBulkFaq(bulkInput.value);

      if (!parsedItems.length) {
        bulkStatus.textContent = "Não encontrei perguntas no formato 1. Pergunta?";
        return;
      }

      state.items = parsedItems;
      bulkStatus.textContent = `${parsedItems.length} pergunta${parsedItems.length === 1 ? "" : "s"} preenchida${parsedItems.length === 1 ? "" : "s"}.`;
      renderEditor();
    }

    function addItem() {
      state.items.push({ question: "", answer: "" });
      renderEditor();
      const lastItem = editor.querySelector(".faq-editor__item:last-child input");
      if (lastItem) {
        lastItem.focus();
      }
    }

    async function copyGeneratedHtml() {
      generatedHtml.focus();
      generatedHtml.select();

      try {
        await navigator.clipboard.writeText(generatedHtml.value);
      } catch (error) {
        document.execCommand("copy");
      }

      copyStatus.textContent = "HTML copiado.";
      window.setTimeout(() => {
        copyStatus.textContent = "";
      }, 2400);
    }

    editor.addEventListener("input", (event) => {
      const field = event.target.dataset.field;
      if (!field) {
        return;
      }

      const itemElement = event.target.closest(".faq-editor__item");
      const index = Number(itemElement.dataset.index);
      state.items[index][field] = event.target.value;
      updateOutput();
    });

    editor.addEventListener("click", (event) => {
      const button = event.target.closest("[data-action='remove']");
      if (!button) {
        return;
      }

      const itemElement = button.closest(".faq-editor__item");
      const index = Number(itemElement.dataset.index);
      state.items.splice(index, 1);

      if (state.items.length === 0) {
        state.items.push({ question: "", answer: "" });
      }

      renderEditor();
    });

    document.querySelector("#fillFromBulk").addEventListener("click", fillFromBulk);
    document.querySelector("#addItem").addEventListener("click", addItem);
    document.querySelector("#addItemTop").addEventListener("click", addItem);
    document.querySelector("#copyHtml").addEventListener("click", copyGeneratedHtml);
    document.querySelector("#copyHtmlTop").addEventListener("click", copyGeneratedHtml);

    renderEditor();
  </script>
</body>
</html>
