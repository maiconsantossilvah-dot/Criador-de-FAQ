<section class="ll-carousel" aria-label="Carrossel de layouts">
  <input class="ll-carousel__radio" id="ll-carousel-slide-1" name="ll-carousel" type="radio" checked>
  <input class="ll-carousel__radio" id="ll-carousel-slide-2" name="ll-carousel" type="radio">
  <div class="ll-carousel__viewport">
    <article class="ll-carousel__panel ll-carousel__layout--impact">
      <div class="ll-carousel__text">
        <p class="ll-carousel__eyebrow">Impacto visual</p>
        <h2>Mensagem curta em destaque</h2>
        <p>Use este espaco para resumir uma ideia principal.</p>
      </div>
      <figure class="ll-carousel__figure">
        <picture>
          <img class="ll-carousel__image" src="https://placehold.co/780x740/webp" alt="Imagem de impacto">
        </picture>
      </figure>
    </article>
  </div>
  <nav class="ll-carousel__nav" aria-label="Slides do carrossel">
    <label for="ll-carousel-slide-1">Impacto</label>
    <label for="ll-carousel-slide-2">Decisao</label>
  </nav>
</section>
